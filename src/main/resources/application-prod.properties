spring.config.activate.on-profile= prod
spring.application.name=EduNest

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_NAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema Management: Flyway manages migrations; Hibernate strictly validates (EB-43 / DB-01 / DEP-04)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---- Hibernate JDBC Batching (P4-12 / DB-07) ----
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Flyway Production Migration Hardening (EB-43)
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Baseline schema
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false

# P1-21 / EB-28 (FILE-01): file:uploads/ removed from static locations — it mapped
# the uploads tree onto the default /** resource handler (unprefixed private-file
# leak, e.g. GET /submissions/... for any authenticated user). Public upload
# serving is now ONLY via the explicit WebConfig allowlist of UploadPolicy's
# public folders; private content flows through ownership-checked /files/** only.
spring.web.resources.static-locations=classpath:/static/
spring.jackson.deserialization.fail-on-unknown-properties=true
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Platform Default Commission Rate (EB-47 / P3-05 / MSH-05 / D-17 Day-1 seed)
app.commission.default=${APP_COMMISSION_DEFAULT:10.0}
spring.flyway.placeholders.defaultCommissionRate=${app.commission.default}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# --- Zoom live-meeting integration ([ADD-05] EB-85 groundwork) ---
# Same env contract as the default profile; prod only flips ZOOM_ENABLED once
# the Marketplace app is provisioned. Placeholder keeps boot safe meanwhile.
app.zoom.enabled=${ZOOM_ENABLED:false}
app.zoom.account-id=${ZOOM_ACCOUNT_ID:}
app.zoom.client-id=${ZOOM_CLIENT_ID:}
app.zoom.client-secret=${ZOOM_CLIENT_SECRET:}
app.zoom.base-url=${ZOOM_BASE_URL:https://api.zoom.us/v2}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

