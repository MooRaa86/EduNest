spring.application.name=EduNest

# Transitional frontend compatibility. Disable after consumers use the Authorization header.
app.auth.return-token-in-body=${APP_AUTH_RETURN_TOKEN_IN_BODY:true}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_NAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.forward-headers-strategy=framework


spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# --- Zoom live-meeting integration ([ADD-05] EB-85 groundwork) ---
# Server-to-Server OAuth app credentials (Marketplace scopes:
# meeting:write:admin + meeting:read:admin; no redirect URI needed).
# Integration stays OFF until ZOOM_ENABLED=true; while off, the placeholder
# client bean is used and no external call is ever made.
app.zoom.enabled=${ZOOM_ENABLED:false}
app.zoom.account-id=${ZOOM_ACCOUNT_ID:}
app.zoom.client-id=${ZOOM_CLIENT_ID:}
app.zoom.client-secret=${ZOOM_CLIENT_SECRET:}
app.zoom.base-url=${ZOOM_BASE_URL:https://api.zoom.us/v2}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha
