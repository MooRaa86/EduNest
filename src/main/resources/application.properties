spring.application.name=EduNest

# EB-67: expose only status-only health probes and administrator-only info.
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoint.info.access=read-only
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState

# Transitional frontend compatibility. Disable after consumers use the Authorization header.
app.auth.return-token-in-body=${APP_AUTH_RETURN_TOKEN_IN_BODY:true}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_NAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema Management: Flyway manages migrations; Hibernate strictly validates (EB-43 / DB-01 / DEP-04)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway Database Migration Configuration (EB-43)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Baseline schema
spring.flyway.clean-disabled=true

# Platform Default Commission Rate (EB-47 / P3-05 / MSH-05 / D-17 Day-1 seed)
app.commission.default=${APP_COMMISSION_DEFAULT:10.0}
spring.flyway.placeholders.defaultCommissionRate=${app.commission.default}

server.forward-headers-strategy=framework


spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# --- Zoom live-meeting integration ([ADD-05] EB-85 groundwork) ---
# Server-to-Server OAuth app credentials (Marketplace scopes:
# meeting:write:admin + meeting:read:admin; no redirect URI needed).
# Integration stays OFF until ZOOM_ENABLED=true; while off, the placeholder
# client bean is used and no external call is ever made.
app.zoom.enabled=${ZOOM_ENABLED:false}
app.zoom.account-id=${ZOOM_ACCOUNT_ID:}
app.zoom.client-id=${ZOOM_CLIENT_ID:}
app.zoom.client-secret=${ZOOM_CLIENT_SECRET:}
app.zoom.base-url=${ZOOM_BASE_URL:https://api.zoom.us/v2}
app.zoom.host-user-id=${APP_ZOOM_HOST_USER_ID:me}
app.zoom.max-meeting-minutes=${APP_ZOOM_MAX_MEETING_MINUTES:40}
app.zoom.oauth-token-url=${APP_ZOOM_OAUTH_TOKEN_URL:https://zoom.us/oauth/token}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha

# ── Live Session Auto-Lifecycle & Housekeeping (P4-08 / EB-57) ───
app.livesession.auto-close.enabled=${APP_LIVESESSION_AUTO_CLOSE_ENABLED:true}
app.livesession.auto-close.grace-minutes=${APP_LIVESESSION_AUTO_CLOSE_GRACE_MINUTES:10}
app.livesession.auto-close.max-duration-minutes=${APP_LIVESESSION_AUTO_CLOSE_MAX_DURATION_MINUTES:40}
app.livesession.auto-close.sweep-rate-ms=${APP_LIVESESSION_AUTO_CLOSE_SWEEP_RATE_MS:300000}

# ── Live Session Attendance Strategy (D-15 dormant by default) ───
app.livesession.attendance.enforced=${APP_LIVESESSION_ATTENDANCE_ENFORCED:false}
app.livesession.attendance.pass-threshold=${APP_LIVESESSION_ATTENDANCE_PASS_THRESHOLD:75}
app.livesession.attendance.snapshot-grid-minutes=${APP_LIVESESSION_ATTENDANCE_SNAPSHOT_GRID_MINUTES:5}
app.livesession.attendance.bonus-points=${APP_LIVESESSION_ATTENDANCE_BONUS_POINTS:5}
app.livesession.attendance.absence-floor=${APP_LIVESESSION_ATTENDANCE_ABSENCE_FLOOR:0}

# --- Supabase Storage (S3) Integration ([ADD-03] EB-83) ---
# Project: ciogysvcykzxrjuskxmk
supabase.storage.endpoint=${SUPABASE_S3_ENDPOINT:https://ciogysvcykzxrjuskxmk.storage.supabase.co/storage/v1/s3}
supabase.storage.region=${SUPABASE_S3_REGION:eu-west-1}
supabase.storage.access-key=${SUPABASE_S3_ACCESS_KEY:}
supabase.storage.secret-key=${SUPABASE_S3_SECRET_KEY:}
supabase.storage.public-bucket=${SUPABASE_STORAGE_PUBLIC_BUCKET:edunest-public}
supabase.storage.private-bucket=${SUPABASE_STORAGE_PRIVATE_BUCKET:edunest-private}
supabase.storage.enabled=${SUPABASE_STORAGE_ENABLED:false}
supabase.url=${SUPABASE_URL:https://ciogysvcykzxrjuskxmk.supabase.co}
