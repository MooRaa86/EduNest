spring.config.activate.on-profile= test
spring.application.name=EduNest

# =====================================================================
# TEST PROFILE (P2-01 / EB-35, decision D-26: H2 in-memory, no Docker)
# Goal: `mvnw test` boots and passes on ANY machine with zero setup —
# no local MySQL, no env vars, no secrets. Everything real is faked here.
# =====================================================================

# ---- Database: H2 in-memory, MySQL compatibility mode ----
# MODE=MySQL         -> closest syntax/behavior parity to prod MySQL
# DATABASE_TO_LOWER  -> unquoted identifiers lowercase (sane cross-DB default)
# CASE_INSENSITIVE   -> MySQL-like identifier comparison
# DB_CLOSE_DELAY=-1  -> keep the in-memory DB alive as long as the JVM lives
spring.datasource.url=jdbc:h2:mem:edunest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Fresh schema every context boot; nothing survives the JVM
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ---- Mail: never connect, just resolve the placeholders (EmailService reads username) ----
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=edunest-tests@example.com
spring.mail.password=fake-test-password
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

# ---- Security guards (EB-8 / EB-9): fixed fake secret + explicit dev chain ----
JWT_SECRET=edunest-test-secret-0123456789abcdefghij0123
EDUNEST_UNSAFE_DEV=true

# ---- Uploads: keep test writes out of the repo working tree ----
app.upload.base-dir=target/test-uploads

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
