name: Deploy Staging

# EB-75 [P6-04 / DEP-01] — controlled staging deployment.
#
# Dependency chain (see ops/cicd/staging-pipeline.md for the full contract):
#   tests.yml success on main -> docker-build.yml pushes immutable GHCR image
#   -> THIS workflow: activation gate -> trigger verification -> migration
#   gate -> Railway deploy -> smoke verification -> evidence artifact.
#
# Hard rules enforced here:
# - BOTH deployment paths are DISABLED by default:
#   * Automatic deployment requires the repository variable
#     STAGING_AUTO_DEPLOY_ENABLED to be exactly 'true' (activation gate G7);
#   * Manual dispatch additionally requires the repository variable
#     STAGING_MANUAL_DEPLOY_ENABLED to be exactly 'true' (authorization gate
#     G7m) — and still then must pass full commit/image provenance and the
#     'staging' environment protection (required reviewers, if configured).
#     Neither flag is set by this pipeline; the Project Owner activates them
#     explicitly after authorizing the deployment, ideally only after the
#     'staging' environment required-reviewers protection is configured.
# - Gating a flag check reads a non-secret repository variable and requires
#   no approval merely to skip; nothing external is touched while disabled.
# - Never deploy from a failed or incomplete test/image run (G1).
# - Only main may deploy to staging (G2); PR refs never deploy.
# - Tested commit == built commit == deployed image (G3, digest-pinned).
# - Stale-run protection: the triggering run's head_sha must equal
#   default-branch HEAD at deploy time, so an older successful run can never
#   overwrite a newer staging deployment.
# - Missing staging configuration BLOCKS the deployment (G4) instead of
#   continuing silently. Environment-scoped secrets are read ONLY in jobs
#   attached to the 'staging' environment (they are invisible elsewhere —
#   the verify job intentionally accesses none).
# - Migrations never target the production Supabase project (G5) and must
#   positively match the approved staging database identity (G8); they run
#   BEFORE the new image is deployed and a failed migration aborts the deploy.
# - Image refs are digest-pinned (G6); 'latest' is never deployable.
# - Concurrent staging deployments are serialized by the concurrency group
#   (queued, never cancelled mid-deploy).
# - Deployment evidence is published as a workflow artifact (never committed
#   to protected main).
#
# FIRST DEPLOYMENT REQUIREMENT: the Project Owner must (1) set the repository
# variables listed in ops/cicd/staging-pipeline.md (including BOTH activation
# flags), (2) create the GitHub Environment 'staging' with the required
# secrets and configure required-reviewers protection, and (3) explicitly
# authorize activation by setting the flags. Until then every deployment path
# stops at the activation gate — by design, cleanly skipped, nothing deployed.

on:
  workflow_run:
    workflows: [ "Build and Push Docker Image" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:
    # Manual redeploy path: requires an explicitly digest-pinned image ref and
    # the commit SHA that produced it, and still runs the migration gate and
    # smoke. The 'staging' GitHub Environment protection (if configured with
    # required reviewers) applies to every step of this path.
    inputs:
      commit_sha:
        description: "Full commit SHA the image was built from"
        required: true
        type: string
      image_ref:
        description: "Digest-pinned image ref, e.g. ghcr.io/OWNER/edunest-backend@sha256:..."
        required: true
        type: string

concurrency:
  group: staging-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  activation:
    name: Deployment activation gate (G7 automatic / G7m manual)
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      # Reads non-secret repository variables only; no checkout, no secrets,
      # no environment — skipping activation must not require an approval.
      - name: Evaluate activation gate
        id: gate
        env:
          AUTO_DEPLOY: ${{ vars.STAGING_AUTO_DEPLOY_ENABLED }}
          MANUAL_DEPLOY: ${{ vars.STAGING_MANUAL_DEPLOY_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Manual path has its own explicit authorization gate (G7m):
            # disabled by default, exactly 'true' required. Even when enabled,
            # the run still must pass full provenance verification and the
            # 'staging' environment protection downstream.
            if [ "$MANUAL_DEPLOY" = "true" ]; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              echo "manual dispatch: STAGING_MANUAL_DEPLOY_ENABLED=true — operator explicitly requested this deploy (provenance verification and 'staging' environment protection still apply)"
            else
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "STAGING_MANUAL_DEPLOY_ENABLED is not 'true' (got: '$MANUAL_DEPLOY') — manual deployment is DISABLED; no migration, no deployment, no external changes. Repository owners can enable it by setting the repository variable to exactly 'true' after explicit authorization (recommended only after configuring 'staging' environment required reviewers)."
            fi
          elif [ "$AUTO_DEPLOY" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "STAGING_AUTO_DEPLOY_ENABLED=true — automatic staging deployment activated"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "STAGING_AUTO_DEPLOY_ENABLED is not 'true' (got: '$AUTO_DEPLOY') — automatic staging deployment is DISABLED; no migration, no deployment, no external changes. Repository owners can activate by setting the repository variable to exactly 'true' after explicit authorization."
          fi

  verify-and-prepare:
    name: Verify trigger and image identity (G1-G3, G6)
    needs: [activation]
    if: needs.activation.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    outputs:
      verified_sha: ${{ steps.prepare.outputs.verified_sha }}
      image_ref_pinned: ${{ steps.prepare.outputs.image_ref_pinned }}
      image_tags: ${{ steps.prepare.outputs.image_tags }}
      deploy_source: ${{ steps.prepare.outputs.deploy_source }}
    steps:
      # Intentionally NOT attached to the 'staging' environment and reads NO
      # secrets: environment-scoped secrets are only accessible in jobs that
      # reference the environment, so all secret-dependent checks live in the
      # migration/deploy/smoke jobs below.
      - name: Checkout verified revision
        uses: actions/checkout@v4
        with:
          # workflow_run: checkout the TESTED commit (github.sha here is the
          # default-branch HEAD / definition revision, not the tested commit).
          # dispatch: the default branch provides the gate scripts.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Download image identity from trusted image run
        id: artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: image-identity
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare verified deployment identity
        id: prepare
        env:
          # workflow_run path
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGER_STATUS: ${{ github.event.workflow_run.status }}
          TRIGGER_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_SHA: ${{ github.sha }}
          # manual path
          MANUAL_SHA: ${{ inputs.commit_sha }}
          MANUAL_IMAGE_REF: ${{ inputs.image_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          OWNER_LC=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          EXPECTED_PREFIX="ghcr.io/${OWNER_LC}/edunest-backend@sha256:"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual deployment requires FULL provenance — a self-consistent
            # pair of inputs proves nothing on its own. Each check below
            # fails closed.
            echo "deploy_source=manual" >> "$GITHUB_OUTPUT"
            # 1) syntactic validity of both inputs
            bash scripts/cicd/deploy-gate.sh sha40 "$MANUAL_SHA" || exit 1
            bash scripts/cicd/deploy-gate.sh image-ref "$MANUAL_IMAGE_REF" "$EXPECTED_PREFIX" || exit 1
            # 2) the commit belongs to the authorized main history
            CMP_STATUS=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$MANUAL_SHA" --jq .status 2>&1) \
              || { echo "BLOCK: cannot verify commit ancestry against main (gh api: $CMP_STATUS)"; exit 1; }
            case "$CMP_STATUS" in
              identical|behind) echo "commit ancestry OK ($CMP_STATUS) — commit belongs to main history" ;;
              *) echo "BLOCK: supplied commit is NOT part of the authorized main history (compare status: $CMP_STATUS)"; exit 1 ;;
            esac
            # 3) the image was built by the approved successful pipeline
            APPROVED_RUNS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$MANUAL_SHA&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "Build and Push Docker Image" and .conclusion == "success" and .head_branch == "main")] | length' 2>&1) \
              || { echo "BLOCK: cannot query pipeline runs for provenance (gh api: $APPROVED_RUNS)"; exit 1; }
            if [ "$APPROVED_RUNS" -lt 1 ]; then
              echo "BLOCK: no successful 'Build and Push Docker Image' run on main exists for this commit — provenance cannot be proven"
              exit 1
            fi
            # 4) image integrity: pull the pinned digest and require the OCI
            #    revision label to equal the supplied commit
            echo "::add-mask::$GHCR_TOKEN"
            if ! echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null 2>&1; then
              echo "BLOCK: GHCR login failed — cannot verify image integrity"; exit 1
            fi
            if ! docker pull "$MANUAL_IMAGE_REF" >/dev/null 2>&1; then
              echo "BLOCK: pinned image is not pullable — provenance cannot be proven"; exit 1
            fi
            REVISION=$(docker inspect "$MANUAL_IMAGE_REF" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' 2>/dev/null || true)
            bash scripts/cicd/deploy-gate.sh commit-match "$REVISION" "$MANUAL_SHA" "OCI image revision label vs supplied commit" || exit 1
            {
              echo "verified_sha=$MANUAL_SHA"
              echo "image_ref_pinned=$MANUAL_IMAGE_REF"
              echo "image_tags=manual-input (provenance-verified)"
            } >> "$GITHUB_OUTPUT"
          else
            echo "deploy_source=workflow_run" >> "$GITHUB_OUTPUT"
            # G1/G2/G3 + stale-run protection: head_sha must equal current
            # default-branch HEAD, so an older successful image run whose
            # deployment arrives after a newer commit was merged is rejected
            # instead of overwriting newer staging.
            bash scripts/cicd/deploy-gate.sh trigger \
              "$TRIGGER_CONCLUSION" "$TRIGGER_STATUS" "$TRIGGER_HEAD_BRANCH" "$TRIGGER_HEAD_SHA" "$CURRENT_SHA" || exit 1
            bash scripts/cicd/deploy-gate.sh require-config image-identity-artifact "$(cat image-identity.txt 2>/dev/null)" || exit 1
            ART_COMMIT=$(sed -n 's/^commit=//p' image-identity.txt)
            ART_PINNED=$(sed -n 's/^image_ref_pinned=//p' image-identity.txt)
            ART_TAGS=$(sed -n 's/^image_tags=//p' image-identity.txt)
            bash scripts/cicd/deploy-gate.sh commit-match "$ART_COMMIT" "$TRIGGER_HEAD_SHA" "image-identity-artifact commit vs verified trigger commit" || exit 1
            bash scripts/cicd/deploy-gate.sh image-ref "$ART_PINNED" || exit 1
            {
              echo "verified_sha=$TRIGGER_HEAD_SHA"
              echo "image_ref_pinned=$ART_PINNED"
              echo "image_tags=$ART_TAGS"
            } >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  migration-gate:
    name: Staging Flyway migration gate (before deploy)
    needs: [activation, verify-and-prepare]
    if: needs.activation.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout the exact verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-and-prepare.outputs.verified_sha }}
          persist-credentials: false

      # Stale-run protection, re-checked immediately BEFORE the external
      # mutation (automatic path only): if a newer main commit arrived after
      # the initial SHA verification, this run aborts without migrating. The
      # newer commit's own pipeline run deploys it instead. Manual dispatch is
      # exempt by the documented rollback policy (operator explicitly chose an
      # older commit; ancestry + provenance were verified in the verify job).
      - name: Recheck main freshness before mutation (stale-run protection)
        if: needs.verify-and-prepare.outputs.deploy_source == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIED_SHA: ${{ needs.verify-and-prepare.outputs.verified_sha }}
        run: |
          set -euo pipefail
          CURRENT_MAIN=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          bash scripts/cicd/deploy-gate.sh commit-match "$VERIFIED_SHA" "$CURRENT_MAIN" \
            "pre-migration freshness (verified commit vs current main HEAD)" \
            || { echo "BLOCK: a newer main commit arrived — aborting without migrating; the newer commit's own pipeline run will deploy"; exit 1; }

      # All staging secrets are accessed in THIS environment-scoped job (and
      # the jobs below) — nowhere else. Values are preflighted as set/empty
      # flags only and masked before any output; they are never printed,
      # passed through job outputs, or written to artifacts.
      - name: Preflight migration configuration (G4 — fail closed)
        env:
          STAGING_FLYWAY_URL_SET: ${{ secrets.STAGING_FLYWAY_URL != '' && 'set' || '' }}
          STAGING_FLYWAY_USER_SET: ${{ secrets.STAGING_FLYWAY_USER != '' && 'set' || '' }}
          STAGING_FLYWAY_PASSWORD_SET: ${{ secrets.STAGING_FLYWAY_PASSWORD != '' && 'set' || '' }}
          STAGING_DB_PROJECT_REF: ${{ vars.STAGING_DB_PROJECT_REF }}
        run: |
          set -uo pipefail
          bash scripts/cicd/deploy-gate.sh require-config \
            STAGING_FLYWAY_URL "$STAGING_FLYWAY_URL_SET" \
            STAGING_FLYWAY_USER "$STAGING_FLYWAY_USER_SET" \
            STAGING_FLYWAY_PASSWORD "$STAGING_FLYWAY_PASSWORD_SET" \
            STAGING_DB_PROJECT_REF "$STAGING_DB_PROJECT_REF"

      # G5 (coarse: production ref must not appear anywhere) + G8 (positive
      # identity: the ACTUAL supplied identity — FLYWAY_USER, the separate
      # username the db-migrate profile really connects with — plus the URL
      # host form must match the approved staging Supabase project; an
      # approved ref present only in an unrelated URL parameter is not proof).
      # No approved live-database marker exists today (Supabase does not
      # expose project identity via SQL), so identity is credential+host
      # based; this limitation is documented in the pipeline contract.
      - name: Guard migration target identity (G5/G8 — never production)
        env:
          STAGING_FLYWAY_URL: ${{ secrets.STAGING_FLYWAY_URL }}
          FLYWAY_USER: ${{ secrets.STAGING_FLYWAY_USER }}
          STAGING_DB_PROJECT_REF: ${{ vars.STAGING_DB_PROJECT_REF }}
        run: |
          set -uo pipefail
          echo "::add-mask::$STAGING_FLYWAY_URL"
          bash scripts/cicd/deploy-gate.sh migration-url "$STAGING_FLYWAY_URL"
          bash scripts/cicd/deploy-gate.sh staging-db-identity "$STAGING_FLYWAY_URL" "$FLYWAY_USER" "$STAGING_DB_PROJECT_REF" ciogysvcykzxrjuskxmk

      # Migration contract: the exact operator sequence from
      # src/main/resources/db/migration/README.md §3.1.1, executed by the
      # pipeline as an authorized operator. No repair, no clean, no baseline —
      # a failed migration BLOCKS deployment (the deploy job needs this job).
      - name: Set up JDK 21 + Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Flyway info -> validate (pending ignored) -> migrate -> strict validate -> info
        env:
          FLYWAY_URL: ${{ secrets.STAGING_FLYWAY_URL }}
          FLYWAY_USER: ${{ secrets.STAGING_FLYWAY_USER }}
          FLYWAY_PASSWORD: ${{ secrets.STAGING_FLYWAY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "::add-mask::$FLYWAY_URL"
          echo "::add-mask::$FLYWAY_USER"
          echo "::add-mask::$FLYWAY_PASSWORD"
          ./mvnw -B -Pdb-migrate flyway:info
          ./mvnw -B -Pdb-migrate '-Dflyway.ignoreMigrationPatterns=*:pending' flyway:validate
          ./mvnw -B -Pdb-migrate flyway:migrate
          ./mvnw -B -Pdb-migrate '-Dflyway.ignoreMigrationPatterns=' flyway:validate
          ./mvnw -B -Pdb-migrate flyway:info
          echo "migration gate passed; safe to deploy the matching image"

  deploy-staging:
    name: Deploy digest-pinned image to Railway staging
    needs: [activation, verify-and-prepare, migration-gate]
    if: needs.activation.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      deployment_id: ${{ steps.deploy.outputs.deployment_id }}
      deployment_note: ${{ steps.deploy.outputs.deployment_note }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-and-prepare.outputs.verified_sha }}
          persist-credentials: false

      - name: Install Railway CLI
        run: npm install -g @railway/cli@^4

      - name: Preflight Railway configuration (G4 — fail closed)
        env:
          RAILWAY_TOKEN_SET: ${{ secrets.RAILWAY_TOKEN != '' && 'set' || '' }}
          RAILWAY_STAGING_PROJECT_ID: ${{ vars.RAILWAY_STAGING_PROJECT_ID }}
          RAILWAY_STAGING_SERVICE_ID: ${{ vars.RAILWAY_STAGING_SERVICE_ID }}
          RAILWAY_STAGING_ENVIRONMENT_ID: ${{ vars.RAILWAY_STAGING_ENVIRONMENT_ID }}
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: |
          set -uo pipefail
          bash scripts/cicd/deploy-gate.sh require-config \
            RAILWAY_TOKEN "$RAILWAY_TOKEN_SET" \
            RAILWAY_STAGING_PROJECT_ID "$RAILWAY_STAGING_PROJECT_ID" \
            RAILWAY_STAGING_SERVICE_ID "$RAILWAY_STAGING_SERVICE_ID" \
            RAILWAY_STAGING_ENVIRONMENT_ID "$RAILWAY_STAGING_ENVIRONMENT_ID" \
            STAGING_BASE_URL "$STAGING_BASE_URL"

      # Second stale-run protection checkpoint, immediately BEFORE the
      # external Railway mutation (automatic path only). Covers a commit
      # arriving between the migration gate and the deploy, and multiple
      # queued runs: a queued older run re-verifies here and aborts without
      # touching Railway.
      - name: Recheck main freshness before deploy mutation (stale-run protection)
        if: needs.verify-and-prepare.outputs.deploy_source == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIED_SHA: ${{ needs.verify-and-prepare.outputs.verified_sha }}
        run: |
          set -euo pipefail
          CURRENT_MAIN=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          bash scripts/cicd/deploy-gate.sh commit-match "$VERIFIED_SHA" "$CURRENT_MAIN" \
            "pre-deploy freshness (verified commit vs current main HEAD)" \
            || { echo "BLOCK: a newer main commit arrived — aborting without touching Railway"; exit 1; }

      # Verified Railway mechanism (Railway CLI v4; railway deploy --image does
      # NOT exist — that command provisions templates):
      #   1. railway service source connect --image <ref>  — sets/updates the
      #      service's Docker image source (all flags verified: -p/-s/-e/--image/--json).
      #   2. railway redeploy --from-source                — pulls and deploys
      #      the configured image source (pushing a new image does NOT
      #      redeploy on its own; --from-source makes it deterministic).
      # The image ref is digest-pinned (G6); deploying an unpinned image or
      # rebuilding from source (railway up) is deliberately not a fallback —
      # if the image source cannot be set, this step fails and nothing deploys.
      # Registry pull credentials (GHCR read:packages token) are configured
      # once on the service in the Railway dashboard (ops/cicd/
      # staging-pipeline.md), never through this workflow.
      - name: Deploy image (pinned by digest) and track the created deployment
        id: deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_STAGING_PROJECT_ID: ${{ vars.RAILWAY_STAGING_PROJECT_ID }}
          RAILWAY_STAGING_SERVICE_ID: ${{ vars.RAILWAY_STAGING_SERVICE_ID }}
          RAILWAY_STAGING_ENVIRONMENT_ID: ${{ vars.RAILWAY_STAGING_ENVIRONMENT_ID }}
          IMAGE_REF: ${{ needs.verify-and-prepare.outputs.image_ref_pinned }}
          VERIFIED_SHA: ${{ needs.verify-and-prepare.outputs.verified_sha }}
        run: |
          set -euo pipefail
          echo "::add-mask::$RAILWAY_TOKEN"
          railway service source connect \
            --image "$IMAGE_REF" \
            --project "$RAILWAY_STAGING_PROJECT_ID" \
            --service "$RAILWAY_STAGING_SERVICE_ID" \
            --environment "$RAILWAY_STAGING_ENVIRONMENT_ID" \
            --json
          railway redeploy \
            --from-source --yes --json \
            --project "$RAILWAY_STAGING_PROJECT_ID" \
            --service "$RAILWAY_STAGING_SERVICE_ID" \
            --environment "$RAILWAY_STAGING_ENVIRONMENT_ID" \
            > /tmp/railway-redeploy.json
          # Track the ACTUAL deployment created by this run. The redeploy
          # --json payload is expected to carry a deployment identifier; the
          # exact field name is not pinned by the CLI docs, so common shapes
          # are tried. If none is found the deployment CANNOT be verified
          # later — fail closed instead of trusting existing service health.
          DEPLOY_ID=$(jq -r 'try (.id // .deployment.id // .deploymentId // .deploymentId.id) // empty' /tmp/railway-redeploy.json 2>/dev/null || true)
          if [ -z "$DEPLOY_ID" ]; then
            echo "BLOCK: could not capture the Railway deployment id created by this run — deployment identity is untrackable, failing closed (no success is claimed; the previous deployment keeps serving)"
            exit 1
          fi
          {
            echo "deployment_id=$DEPLOY_ID"
            echo "deployment_note=image $IMAGE_REF deployed to Railway staging (service $RAILWAY_STAGING_SERVICE_ID, deployment $DEPLOY_ID) from commit $VERIFIED_SHA"
          } >> "$GITHUB_OUTPUT"

      # Track the created deployment to a TERMINAL successful status before
      # smoke: health checks can be served by the PREVIOUS deployment, so
      # success is never inferred from existing service health. Railway CLI
      # 4.68.0: `railway deployment list` has NO --project flag — project
      # context is established first with `railway link` (documented flags
      # -p/-s/-e; writes local runner config only, non-destructive). Id and
      # status field names are not pinned by the CLI docs; common shapes are
      # tried and a conclusive terminal status is required, otherwise this
      # step FAILS CLOSED (the run reports the deployment as unverified).
      - name: Await tracked Railway deployment completion
        id: watch
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_STAGING_PROJECT_ID: ${{ vars.RAILWAY_STAGING_PROJECT_ID }}
          RAILWAY_STAGING_SERVICE_ID: ${{ vars.RAILWAY_STAGING_SERVICE_ID }}
          RAILWAY_STAGING_ENVIRONMENT_ID: ${{ vars.RAILWAY_STAGING_ENVIRONMENT_ID }}
          DEPLOY_ID: ${{ steps.deploy.outputs.deployment_id }}
          IMAGE_REF: ${{ needs.verify-and-prepare.outputs.image_ref_pinned }}
        run: |
          echo "::add-mask::$RAILWAY_TOKEN"
          railway link \
            --project "$RAILWAY_STAGING_PROJECT_ID" \
            --service "$RAILWAY_STAGING_SERVICE_ID" \
            --environment "$RAILWAY_STAGING_ENVIRONMENT_ID" \
            --json >/dev/null
          for attempt in $(seq 1 20); do
            if railway deployment list \
              --service "$RAILWAY_STAGING_SERVICE_ID" \
              --environment "$RAILWAY_STAGING_ENVIRONMENT_ID" \
              --limit 20 --json > /tmp/railway-deployments.json 2>/dev/null; then
              ENTRY=$(jq -c --arg id "$DEPLOY_ID" '.[]? | select((.id // .deploymentId // "") == $id)' /tmp/railway-deployments.json 2>/dev/null || true)
              if [ -n "$ENTRY" ]; then
                STATUS=$(printf '%s' "$ENTRY" | jq -r 'try (.status // .state // "unknown")' 2>/dev/null || echo unknown)
                echo "attempt $attempt: deployment $DEPLOY_ID status: $STATUS"
                case "$STATUS" in
                  SUCCESS|DEPLOYED|ACTIVE)
                    if printf '%s' "$ENTRY" | grep -Fq "$IMAGE_REF"; then
                      echo "tracked deployment identity matches the pinned image ref"
                    else
                      echo "note: tracked deployment entry does not echo the image ref (status schema-dependent; digest was pinned at source connect)"
                    fi
                    echo "deployment_ok=true" >> "$GITHUB_OUTPUT"
                    exit 0
                    ;;
                  CRASHED|FAILED)
                    echo "BLOCK: tracked Railway deployment $DEPLOY_ID reached a failed terminal state ($STATUS)"
                    exit 1
                    ;;
                esac
              else
                echo "attempt $attempt: deployment $DEPLOY_ID not in list yet"
              fi
            fi
            sleep 30
          done
          echo "BLOCK: tracked deployment $DEPLOY_ID did not reach a terminal successful status within the observation window — deployment is UNVERIFIED, failing closed"
          exit 1

  smoke-verify:
    name: Staging smoke verification (EB-73 script)
    needs: [activation, verify-and-prepare, deploy-staging]
    if: needs.activation.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-and-prepare.outputs.verified_sha }}
          persist-credentials: false

      # The tracked Railway deployment has reached a terminal successful
      # status in the deploy job, but the container may still be finishing
      # its rollout: poll liveness briefly, then run the full EB-73 smoke
      # (health groups, Swagger UI, STOMP ws/info). A smoke failure fails
      # this job, which marks the deployment unsuccessful and is recorded in
      # evidence. The workflow cannot report success before this job
      # succeeds, and success is never inferred from existing service health.
      - name: Wait for staging rollout
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: |
          set -uo pipefail
          ok=""
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 10 "$STAGING_BASE_URL/actuator/health/liveness" | grep -q '"UP"'; then
              ok=yes; echo "staging liveness UP (attempt $attempt)"; break
            fi
            echo "attempt $attempt: not UP yet; retrying in 30s"; sleep 30
          done
          if [ -z "$ok" ]; then echo "staging did not become live within the rollout window"; exit 1; fi

      - name: Run EB-73 staging smoke
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ops/staging/Invoke-StagingSmoke.ps1 -BaseUrl "$STAGING_BASE_URL"

      # Runtime commit identity: since EB-79 the image exposes build-info
      # (full git.commit.id) at /actuator/info. A MISMATCH fails the run; an
      # ABSENT value only occurs for a pre-EB-79 image (e.g. a manual
      # rollback target) and is recorded without hard-failing the rollback.
      - name: Verify deployed commit identity (/actuator/info)
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          VERIFIED_SHA: ${{ needs.verify-and-prepare.outputs.verified_sha }}
        run: |
          set -uo pipefail
          INFO_JSON=$(curl -fsS --max-time 10 "$STAGING_BASE_URL/actuator/info" || true)
          DEPLOYED_COMMIT=$(printf '%s' "$INFO_JSON" | jq -r 'try (.git.commit.id // empty)' 2>/dev/null || true)
          if [ -z "$DEPLOYED_COMMIT" ]; then
            echo "WARN: /actuator/info does not expose git.commit.id (pre-EB-79 image) — deployed commit identity recorded as not exposed"
            exit 0
          fi
          if [ "$DEPLOYED_COMMIT" != "$VERIFIED_SHA" ]; then
            echo "BLOCK: deployed image reports commit identity that does not match the verified commit"
            exit 1
          fi
          echo "OK: deployed image /actuator/info reports the verified commit identity"

  publish-evidence:
    name: Publish deployment evidence (audit artifact)
    runs-on: ubuntu-latest
    needs: [activation, verify-and-prepare, migration-gate, deploy-staging, smoke-verify]
    if: always()
    steps:
      - name: Assemble deployment evidence
        env:
          ACTIVATION_ENABLED: ${{ needs.activation.outputs.enabled }}
          VERIFIED_SHA: ${{ needs.verify-and-prepare.outputs.verified_sha }}
          IMAGE_REF_PINNED: ${{ needs.verify-and-prepare.outputs.image_ref_pinned }}
          IMAGE_TAGS: ${{ needs.verify-and-prepare.outputs.image_tags }}
          DEPLOY_SOURCE: ${{ needs.verify-and-prepare.outputs.deploy_source }}
          DEPLOYMENT_ID: ${{ needs.deploy-staging.outputs.deployment_id }}
          MIGRATION_OUTCOME: ${{ needs.migration-gate.result }}
          DEPLOY_OUTCOME: ${{ needs.deploy-staging.result }}
          SMOKE_OUTCOME: ${{ needs.smoke-verify.result }}
          DEPLOY_NOTE: ${{ needs.deploy-staging.outputs.deployment_note }}
        run: |
          set -uo pipefail
          overall=SUCCESS
          for outcome in "$MIGRATION_OUTCOME" "$DEPLOY_OUTCOME" "$SMOKE_OUTCOME"; do
            case "$outcome" in success) : ;; *) overall=FAILED ;; esac
          done
          {
            echo "DEPLOYMENT OVERALL: $overall"
            echo "activation_gate=$ACTIVATION_ENABLED"
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "deploy_source=$DEPLOY_SOURCE"
            echo "triggering_run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "verified_commit=$VERIFIED_SHA"
            echo "image_ref_pinned=$IMAGE_REF_PINNED"
            echo "image_tags=$IMAGE_TAGS"
            echo "railway_deployment_id=$DEPLOYMENT_ID"
            echo "migration_gate=$MIGRATION_OUTCOME"
            echo "railway_deploy=$DEPLOY_OUTCOME"
            echo "staging_smoke=$SMOKE_OUTCOME"
            echo "deploy_note=$DEPLOY_NOTE"
            echo "rollback_policy=Application rollback = manual workflow_dispatch redeploy of the previous digest-pinned image (provenance-verified); automatic deployments only ever deploy the newest verified main HEAD and will supersede a manual rollback on the next successful run. Database migrations are forward-only and are NOT auto-rolled back (see ops/cicd/staging-pipeline.md)."
          } > deployment-evidence.txt
          cat deployment-evidence.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence artifact (never committed to main)
        uses: actions/upload-artifact@v4
        with:
          name: staging-deployment-evidence-${{ github.run_id }}
          path: deployment-evidence.txt
          if-no-files-found: error
