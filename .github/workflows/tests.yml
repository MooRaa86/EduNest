name: tests

# EB-41 [P2-07 / DEP-01, TST-03] — the merge gate.
# Tests are fully self-contained (EB-35 test profile / D-27) → no services, no secrets, no Docker.
# Trigger decision (user, 2026-10-28): every PR to main + every push to main
# (plan text said `develop`; user merges straight to `main` — recorded in the P2-07 row).
# Command decision (user): `mvnw package` — full test suite + JAR packaging, catching packaging breakage too.

on:
  pull_request: # every PR targeting main
    branches: [ main ]
  push: # every merge/push to main
    branches: [ main ]

concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true # new push on the same PR cancels the superseded run

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build + test + package (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin) + Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # No-skip enforcement (P2-07 core requirement): skipping is forbidden even if
      # someone adds -DskipTests locally; failures are never ignored.
      - name: Build, test, package — skipping forbidden
        run: ./mvnw -B package -DskipTests=false -Dmaven.test.failure.ignore=false

      # EB-44 [P3-02]: the two Uniqueness*IT classes (PostgreSQL Testcontainers) are
      # OUTSIDE surefire's default includes (Test*, *Test, *Tests, *TestCase) and were
      # therefore never executed by the package step above. Run them explicitly.
      # Docker is REQUIRED for this verification: a missing daemon must FAIL the
      # pipeline, not silently skip (assumption-based skips are not acceptable here).
      - name: Docker availability gate (EB-44 PostgreSQL integration verification REQUIRED)
        run: |
          if ! docker info > /dev/null 2>&1; then
            echo "::error::Docker daemon unavailable — the required EB-44 PostgreSQL integration verification (Uniqueness*IT, 16 tests) cannot run."
            exit 1
          fi

      - name: EB-44 PostgreSQL integration tests (Testcontainers — all 16 must execute)
        run: >
          ./mvnw -B test
          "-Dtest=UniquenessPostgresMigrationIT,UniquenessHttpPostgresIT"
          "-Dsurefire.failIfNoSpecifiedTests=true"
          "-DskipTests=false"
          "-Dmaven.test.failure.ignore=false"

      - name: Assert EB-44 integration tests actually executed (no silent skip)
        if: always()
        run: |
          if [ ! -d target/surefire-reports ]; then echo "::error::no surefire reports produced"; exit 1; fi
          expect_migration='Tests run: 5, Failures: 0, Errors: 0, Skipped: 0'
          expect_http='Tests run: 11, Failures: 0, Errors: 0, Skipped: 0'
          for pair in "UniquenessPostgresMigrationIT:${expect_migration}" "UniquenessHttpPostgresIT:${expect_http}"; do
            cls="${pair%%:*}"
            expected="${pair#*:}"
            report="target/surefire-reports/com.example.gradproj.EduNest.migration.${cls}.txt"
            if [ ! -f "$report" ]; then echo "::error::missing report for ${cls}"; exit 1; fi
            counts=$(grep -E 'Tests run: [0-9]+' "$report" | head -n 1)
            echo "${cls}: ${counts}"
            if ! echo "$counts" | grep -F "$expected"; then
              echo "::error::${cls} did not execute cleanly (expected '${expected}' in its surefire report)"
              exit 1
            fi
          done

      - name: EB-45 PostgreSQL transaction and file rollback tests
        run: |
          ./mvnw -B test "-Dtest=TransactionalFileReplacementPostgresIT" "-Dsurefire.failIfNoSpecifiedTests=true" "-DskipTests=false" "-Dmaven.test.failure.ignore=false"
          report="target/surefire-reports/com.example.gradproj.EduNest.service.fileSotageService.TransactionalFileReplacementPostgresIT.txt"
          if [ ! -f "$report" ] || ! grep -F 'Tests run: 5, Failures: 0, Errors: 0, Skipped: 0' "$report"; then
            echo "::error::EB-45 PostgreSQL tests did not all execute successfully"
            exit 1
          fi

      - name: Upload EB-44 integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eb44-integration-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload test reports (kept even when red)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      # P2-08 / EB-42 (TST-04): Advisory static analysis scan
      - name: Static analysis scan (SpotBugs advisory)
        run: ./mvnw -B spotbugs:check
        continue-on-error: true

      - name: Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-reports
          path: target/spotbugsXml.xml
          if-no-files-found: ignore
