name: tests

# EB-41 [P2-07 / DEP-01, TST-03] — the merge gate.
# Tests use the EB-35 test profile; PostgreSQL integration gates require Docker.
# Trigger decision (user, 2026-10-28): every PR to main + every push to main
# (plan text said `develop`; user merges straight to `main` — recorded in the P2-07 row).
# EB-113 [P6-10]: PRs targeting production now run the same gate (release quality gate).
# Command decision (user): `mvnw package` — full test suite + JAR packaging, catching packaging breakage too.

on:
  pull_request: # every PR targeting main (EB-41) or production (EB-113 release gate)
    branches: [ main, production ]
  push: # every merge/push to main
    branches: [ main ]

concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true # new push on the same PR cancels the superseded run

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build + test + package (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # EB-77 [P6-06 / FILE-06]: Repository hygiene gate — reject upload files tracked in
      # Git index / HEAD or introduced within PR / push commit ranges.
      - name: Repository hygiene gate (EB-77 / FILE-06)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          bash scripts/cicd/repo-hygiene-gate.sh check-ci "$EVENT_NAME" "$BASE_REF" "$BEFORE_SHA" "$AFTER_SHA"

      - name: Set up JDK 21 (Temurin) + Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # EB-44 [P3-02]: the two Uniqueness*IT classes (PostgreSQL Testcontainers) are
      # OUTSIDE surefire's default includes (Test*, *Test, *Tests, *TestCase) and were
      # therefore never executed by the package step above. Run them explicitly.
      # Docker is REQUIRED for this verification: a missing daemon must FAIL the
      # pipeline, not silently skip (assumption-based skips are not acceptable here).
      - name: Docker availability gate (EB-44 PostgreSQL integration verification REQUIRED)
        run: |
          if ! docker info > /dev/null 2>&1; then
            echo "::error::Docker daemon unavailable — the required EB-44 PostgreSQL integration verification (Uniqueness*IT, 16 tests) cannot run."
            exit 1
          fi

      # Delete the prior class report before the package run so the assertion cannot
      # pass on a stale report. The normal suite executes EB-52 once.
      - name: Build, test, package — skipping forbidden
        run: |
          rm -f target/surefire-reports/TEST-com.example.gradproj.EduNest.service.completion.CompletionLocalPostgresIntegrationTest.xml
          ./mvnw -B package -DskipTests=false -Dmaven.test.failure.ignore=false

      - name: Assert EB-52 PostgreSQL integration tests executed without skips
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path('target/surefire-reports/TEST-com.example.gradproj.EduNest.service.completion.CompletionLocalPostgresIntegrationTest.xml')
          if not report.is_file():
              sys.exit('::error::Missing fresh EB-52 Surefire report')
          try:
              suite = ET.parse(report).getroot()
              counts = {key: int(suite.attrib[key]) for key in ('tests', 'failures', 'errors', 'skipped')}
              cases = suite.findall('testcase')
          except (ET.ParseError, KeyError, ValueError) as error:
              sys.exit(f'::error::Invalid EB-52 Surefire report: {error}')
          print(f'EB-52: {counts}; testcase elements: {len(cases)}')
          if (counts['tests'] < 14 or len(cases) != counts['tests']
                  or counts['failures'] or counts['errors'] or counts['skipped']
                  or any(case.find(tag) is not None for case in cases for tag in ('failure', 'error', 'skipped'))):
              sys.exit('::error::EB-52 PostgreSQL tests did not all execute successfully')
          PY

      - name: EB-44 PostgreSQL integration tests (Testcontainers — all 16 must execute)
        run: >
          ./mvnw -B test
          "-Dtest=UniquenessPostgresMigrationIT,UniquenessHttpPostgresIT"
          "-Dsurefire.failIfNoSpecifiedTests=true"
          "-DskipTests=false"
          "-Dmaven.test.failure.ignore=false"

      - name: Assert EB-44 integration tests actually executed (no silent skip)
        if: always()
        run: |
          if [ ! -d target/surefire-reports ]; then echo "::error::no surefire reports produced"; exit 1; fi
          expect_migration='Tests run: 5, Failures: 0, Errors: 0, Skipped: 0'
          expect_http='Tests run: 11, Failures: 0, Errors: 0, Skipped: 0'
          for pair in "UniquenessPostgresMigrationIT:${expect_migration}" "UniquenessHttpPostgresIT:${expect_http}"; do
            cls="${pair%%:*}"
            expected="${pair#*:}"
            report="target/surefire-reports/com.example.gradproj.EduNest.migration.${cls}.txt"
            if [ ! -f "$report" ]; then echo "::error::missing report for ${cls}"; exit 1; fi
            counts=$(grep -E 'Tests run: [0-9]+' "$report" | head -n 1)
            echo "${cls}: ${counts}"
            if ! echo "$counts" | grep -F "$expected"; then
              echo "::error::${cls} did not execute cleanly (expected '${expected}' in its surefire report)"
              exit 1
            fi
          done

      - name: Upload EB-44 integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eb44-integration-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload test reports (kept even when red)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      # P2-08 / EB-42 (TST-04): Advisory static analysis scan
      - name: Static analysis scan (SpotBugs advisory)
        run: ./mvnw -B spotbugs:check
        continue-on-error: true

      - name: Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-reports
          path: target/spotbugsXml.xml
          if-no-files-found: ignore
